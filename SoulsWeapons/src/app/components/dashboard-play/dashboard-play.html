
<div class="container">
  <h2>Configuración del Juego</h2>

  <form>
    <label for="playerCount">Cantidad de jugadores:</label>
    <input type="number" id="playerCount" [(ngModel)]="playerCount" name="playerCount" min="2" max="7" (change)="onPlayerCountChange()" />

    <div *ngIf="playerCount">
        <div *ngIf="showAddForm" class="add-player-form">
            <input [(ngModel)]="newPlayerName" name="newPlayerName" placeholder="Nombre del nuevo jugador" />

        <!-- <input type="text" [(ngModel)]="newPlayerName" placeholder="Nombre del nuevo jugador" /> -->
        <button type="button" (click)="confirmAddNewPlayer()">Confirmar</button>
        <button type="button" (click)="showAddForm = false">Cancelar</button>
        </div>

        <button type="button" (click)="showAddForm = true" [disabled]="availablePlayers.length >= 20">Agregar nuevo jugador</button>
      <h3>Jugadores disponibles</h3>
      <table>
        <tr>
          <th>Nombre</th>
          <th>Acción</th>
        </tr>
        <tr *ngFor="let player of availablePlayers">
          <td>{{ player }}</td>
          <td>
            <button type="button" (click)="addPlayer(player)" [disabled]="selectedPlayers.includes(player) || selectedPlayers.length >= playerCount">
              Agregar
            </button>
          </td>
        </tr>
      </table>

      <h3>Jugadores seleccionados</h3>
      <ul>
        <li *ngFor="let p of selectedPlayers">{{ p }}</li>
      </ul>
    </div>

    <button type="button" (click)="startGame()" [disabled]="selectedPlayers.length < playerCount">Iniciar juego</button>
  </form>
</div>
